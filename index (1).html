<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>House Groceries</title>
<style>
:root{--bg:#fff;--fg:#1c1c1c;--mut:#6b7280;--card:#f3f4f6;--pri:#2e7d32;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#9ca3af;--card:#1f1f1f;--line:#333;--pri:#66bb6a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
main{padding:8px 16px 80px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px;font-size:15px}nav .on{color:var(--pri);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}.pri{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 14px}
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.bar button,dialog button:not(.pri){border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row>span,.row>div{flex:1}
small{display:block;color:var(--mut)}.done{text-decoration:line-through;color:var(--mut)}.muted{color:var(--mut)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;margin:2px}
.banner{background:#fff3cd;color:#533f03;padding:10px 16px}h3{margin:18px 0 4px}.red{color:#d32f2f}.grn{color:#2e7d32}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.login{max-width:360px;margin:12vh auto;padding:0 20px;text-align:center}.login button{width:100%;margin-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);max-width:92vw;width:420px}dialog button{display:block;width:100%;margin:6px 0;text-align:left}
.qty{width:80px!important}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ====== PASTE YOUR SUPABASE VALUES HERE (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://rsthlmkbdqlbbotivpwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SLGLe4_aG1TCeEJh9qRoAA_72ysEZhF';
// ==================================================================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0 = v => Number.isInteger(+v) ? String(+v) : (+v).toFixed(1);
const dt = t => new Date(t), day = s => new Date(s + 'T00:00:00');
const sid = n => n.trim().toLowerCase().replace(/\//g,'-');
let authInit = false, uid = null, email = '', hid = null, tab = 'list', members = [], chan = null;
let data = {list:[], stock:[], purchases:[], checks:[]};
const T = {list:['list_items','created_at',false], stock:['stock','name',true], purchases:['purchases','created_at',true], checks:['checks','created_at',true]};
const me = () => members.find(m => m.user_id === uid), isAdmin = () => me()?.role === 'admin';

const PROMPTS = {
 stock: 'This is a photo of kitchen/pantry/fridge items. List every grocery item you can identify with an estimated remaining quantity. Use kg, litre or pcs as the unit and a short category (dairy, vegetables, grains, snacks, drinks, household, other). Reply with ONLY JSON: {"items":[{"name":"","qty":0,"unit":"","cat":""}]}',
 bill: 'This is a grocery bill or invoice. Read every purchased line. "price" is the price per ONE unit. Use kg, litre or pcs as the unit and a short category (dairy, vegetables, grains, snacks, drinks, household, other). Reply with ONLY JSON: {"items":[{"name":"","qty":0,"unit":"","cat":"","price":0}]}'
};

// ---------- auth ----------
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(async () => {
    const p = prompt('Type a new password'); if (!p) return;
    const {error} = await sb.auth.updateUser({password: p}); alert(error ? error.message : 'Password changed');
  }, 0);
  const u = session?.user;
  if (authInit && (u?.id ?? null) === uid) return;
  authInit = true;
  uid = u?.id ?? null; email = u?.email ?? ''; stop(); hid = null;
  if (!uid) return showLogin();
  setTimeout(loadProfile, 0);
});
function showLogin(msg='') {
  $('#app').innerHTML = `<div class="login"><h1>House Groceries</h1>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)">
  <button class="pri" data-a="login">Log in</button><button data-a="signup">Create account</button><button data-a="reset">Forgot password</button>
  <p class="red">${esc(msg)}</p></div>`;
}
function showSetup() {
  $('#app').innerHTML = `<div class="login"><h2>Your household</h2>
  <button class="pri" data-a="createH">Create a household</button><button data-a="joinH">Join with an invite code</button><button data-a="logout">Log out</button></div>`;
}
async function loadProfile() {
  const {data:p} = await sb.from('profiles').select('household_id').eq('user_id', uid).maybeSingle();
  if (!p?.household_id) return showSetup();
  hid = p.household_id; startHousehold();
}

// ---------- household ----------
function stop() { if (chan) sb.removeChannel(chan); chan = null; members = []; data = {list:[], stock:[], purchases:[], checks:[]}; }
async function load(k) {
  const [t, o, asc] = T[k];
  const {data:r} = await sb.from(t).select('*').eq('household_id', hid).order(o, {ascending: asc});
  data[k] = r || []; render();
}
const loadAll = () => Promise.all(Object.keys(T).map(load));
async function loadMembers() {
  const {data:m} = await sb.from('members').select('*').eq('household_id', hid);
  members = m || [];
  if (!me()) { stop(); hid = null; await sb.from('profiles').update({household_id: null}).eq('user_id', uid); return showSetup(); }
  render();
}
async function startHousehold() {
  await loadMembers(); if (!hid) return;
  await loadAll();
  chan = sb.channel('h-' + hid);
  for (const [k, [t]] of Object.entries(T))
    chan.on('postgres_changes', {event:'*', schema:'public', table:t, filter:`household_id=eq.${hid}`}, () => load(k));
  chan.on('postgres_changes', {event:'*', schema:'public', table:'members', filter:`household_id=eq.${hid}`}, () => loadMembers());
  chan.subscribe();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && hid) { loadMembers(); loadAll(); } });

async function joinWithCode(code) {
  const old = hid;
  const {data:nh, error} = await sb.rpc('join_with_code', {c: code, nm: email});
  if (error) throw new Error(error.message);
  if (old && old !== nh) {
    for (const t of ['list_items','stock','purchases','checks']) {
      const {data:rows} = await sb.from(t).select('*').eq('household_id', old);
      if (!rows?.length) continue;
      const mapped = rows.map(r => { const x = {...r, household_id: nh}; if (t !== 'stock') delete x.id; return x; });
      await (t === 'stock' ? sb.from(t).upsert(mapped, {onConflict:'household_id,id'}) : sb.from(t).insert(mapped));
    }
    await sb.rpc('leave_household', {h: old});
  }
  await sb.from('profiles').upsert({user_id: uid, household_id: nh});
  stop(); hid = null; await loadProfile();
}

// ---------- views ----------
const due = () => { const n = new Date(); return n.getDate()===15 || new Date(n.getFullYear(), n.getMonth(), n.getDate()+1).getDate()===1; };
function banner() {
  let b = '';
  if (due()) b += '<div class="banner">Stock check day! Open the Stock tab and tap Stock check.</div>';
  const soon = Date.now() + 3*864e5, ex = data.stock.filter(s => s.expiry && day(s.expiry).getTime() <= soon);
  if (ex.length) b += `<div class="banner">Expiring within 3 days: ${esc(ex.slice(0,5).map(s=>s.name).join(', '))}</div>`;
  return b;
}
function render() {
  if (!hid || !me()) return;
  const view = tab==='list' ? viewList() : tab==='stock' ? viewStock() : viewSpend();
  $('#app').innerHTML = `<header><b>House Groceries</b><button data-a="menu">☰ Menu</button></header>${banner()}<main>${view}</main>
  <nav>${['list','stock','spend'].map(t => `<button data-a="tab" data-id="${t}" class="${tab===t?'on':''}">${{list:'🛒 List',stock:'📦 Stock',spend:'📊 Spending'}[t]}</button>`).join('')}</nav>`;
}
function viewList() {
  const favs = data.stock.filter(s => s.fav);
  return `<div class="bar"><button data-a="addItem">＋ Add item</button><button data-a="share">Share on WhatsApp</button></div>
  <div>${favs.map(f => `<button class="chip" data-a="favAdd" data-id="${esc(f.id)}">★ ${esc(f.name)}</button>`).join('')}</div>
  ${data.list.map(i => `<label class="row"><input type="checkbox" data-a="toggle" data-id="${i.id}" ${i.done?'checked':''}><span class="${i.done?'done':''}">${esc(i.name)}<small>added by ${esc(i.by_name)}</small></span><button data-a="delItem" data-id="${i.id}">🗑</button></label>`).join('') || '<p class="muted">Your list is empty.</p>'}`;
}
function stockSub(x) {
  const p = [];
  if (x.cat) p.push(x.cat); if (x.min_qty > 0) p.push('min ' + n0(x.min_qty)); if (x.packet) p.push('pack ' + x.packet);
  if (x.last_bought) { const d = dt(x.last_bought); p.push(`bought ${d.getDate()}/${d.getMonth()+1}`); }
  if (x.expiry) { const d = day(x.expiry); p.push(`expires ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`); }
  return p.join(' · ');
}
function viewStock() {
  return `<div class="bar"><button class="pri" data-a="scan" data-id="stock">📷 Stock check</button><button class="pri" data-a="scan" data-id="bill">🧾 Scan bill</button><button data-a="addStock">＋ Item</button></div>
  ${data.stock.map(s => `<div class="row" data-a="item" data-id="${esc(s.id)}"><div>${s.fav?'★ ':''}${esc(s.name)}<small>${esc(stockSub(s))}</small></div><b class="${(s.min_qty||0)>s.qty?'red':''}">${n0(s.qty)} ${esc(s.unit||'')}</b></div>`).join('') || '<p class="muted">No items yet. Scan a bill or a shelf, or add one.</p>'}`;
}
function viewSpend() {
  const mk = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`, now = mk(new Date());
  const months = {}, cats = {}, prices = {}, buys = {};
  for (const p of data.purchases) {
    const t = dt(p.created_at), v = (p.price||0)*(p.qty||0);
    months[mk(t)] = (months[mk(t)]||0) + v;
    if (mk(t) === now) cats[p.cat||'other'] = (cats[p.cat||'other']||0) + v;
    (prices[p.name] ||= []).push(+p.price||0); (buys[p.name] ||= []).push([t, +p.qty||0]);
  }
  const rise = [], fall = [];
  for (const [n, v] of Object.entries(prices)) if (v.length > 1 && v.at(-2) > 0) { const pc = (v.at(-1)-v.at(-2))/v.at(-2)*100; if (pc > .5) rise.push([n,pc]); if (pc < -.5) fall.push([n,pc]); }
  rise.sort((a,b)=>b[1]-a[1]); fall.sort((a,b)=>a[1]-b[1]);
  const pl = n => `₹${n0(prices[n].at(-2))} → ₹${n0(prices[n].at(-1))}`;
  let ex = '';
  const ck = data.checks;
  if (ck.length >= 2) {
    const a = ck.at(-2), b = ck.at(-1), t0 = dt(a.created_at), t1 = dt(b.created_at);
    for (const [key, bq] of Object.entries(b.items || {})) {
      if (!(key in (a.items||{}))) continue;
      const aq = +a.items[key], name = Object.keys(buys).find(n => n.toLowerCase()===key) || key;
      const bought = (buys[name]||[]).filter(e => e[0] > t0 && e[0] <= t1).reduce((s,e)=>s+e[1], 0);
      const used = Math.max(0, aq + bought - bq), surplus = bought - used;
      if (bought > 0 && bq > aq && surplus > .25*bought)
        ex += `<div class="row"><div>⚠️ ${esc(name)}<small>Bought ${n0(bought)}, used about ${n0(used)}, stock grew by ${n0(bq-aq)}. Next time buy about ${n0(Math.max(0, used-bq))}. Roughly ₹${n0(surplus*((prices[name]||[0]).at(-1)))} tied up.</small></div></div>`;
    }
  }
  const rows = o => Object.entries(o).reverse().map(([k,v]) => `<div class="row"><div>${esc(k)}</div><b>₹${n0(v)}</b></div>`).join('');
  return `<h3>Monthly spending</h3>${rows(months) || '<p class="muted">Scan a bill to start.</p>'}
  <h3>This month by category</h3>${rows(cats) || '<p class="muted">No bills this month.</p>'}
  <h3>Prices going up</h3>${rise.map(([n,p]) => `<div class="row"><div>${esc(n)}<small>${pl(n)}</small></div><b class="red">+${p.toFixed(1)}%</b></div>`).join('') || '<p class="muted">Nothing yet. Needs two purchases of an item.</p>'}
  <h3>Prices dropping</h3>${fall.map(([n,p]) => `<div class="row"><div>${esc(n)}<small>${pl(n)}</small></div><b class="grn">${p.toFixed(1)}%</b></div>`).join('') || '<p class="muted">Nothing yet.</p>'}
  <h3>Buying more than you use</h3>${ck.length < 2 ? '<p class="muted">Do two stock checks (mid and end of month) to see this report.</p>' : (ex || '<p class="muted">No excess found between your last two stock checks.</p>')}`;
}

// ---------- AI photo reading ----------
function pickFile() {
  return new Promise(res => { const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment'); i.onchange = () => res(i.files[0]); i.click(); });
}
async function toB64(file) {
  const bmp = await createImageBitmap(file), r = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = bmp.width*r; c.height = bmp.height*r;
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .8).split(',')[1];
}
async function readPhoto(mode, file) {
  const {data:cfg} = await sb.from('settings').select('*').eq('household_id', hid).maybeSingle();
  if (!cfg?.ai_key) throw new Error('No AI key yet. An admin must add it in the menu.');
  const hint = data.stock.filter(s => s.packet).map(s => `${s.name}: usual pack ${s.packet}`).join('; ');
  const r = await fetch(String(cfg.ai_base_url).replace(/\/+$/,'') + '/chat/completions', {
    method:'POST', headers:{'content-type':'application/json', authorization:'Bearer ' + cfg.ai_key},
    body: JSON.stringify({model: cfg.ai_model, temperature: 0, messages:[{role:'user', content:[
      {type:'text', text: PROMPTS[mode] + (hint ? '\nKnown usual pack sizes: ' + hint : '')},
      {type:'image_url', image_url:{url:'data:image/jpeg;base64,' + await toB64(file)}}]}]})
  });
  if (!r.ok) throw new Error(`AI error ${r.status}: ${(await r.text()).slice(0,100)}`);
  const text = (await r.json()).choices[0].message.content, m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('Could not understand the AI reply');
  return JSON.parse(m[0]).items;
}
function showDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
async function addToList(name) { await sb.from('list_items').insert({household_id: hid, name, by_name: email, by_uid: uid}); load('list'); }
function review(items, mode) {
  showDlg(`<h3>${mode==='bill'?'Check the bill items':'Check the stock counts'}</h3>
  ${items.map((it,i) => `<div class="row"><div>${esc(it.name)} (${esc(it.unit)})</div><input class="qty" type="number" step="any" id="q${i}" value="${+it.qty||0}"></div>`).join('')}
  <button class="pri" id="save">Save</button><button onclick="dlg.close()">Discard</button>`);
  $('#save').onclick = async () => {
    $('#save').disabled = true; const snap = {};
    try {
      for (let i = 0; i < items.length; i++) {
        const it = items[i], q = parseFloat($('#q'+i).value) || 0, name = String(it.name).trim(); if (!name) continue;
        const id = sid(name);
        const {data:ex} = await sb.from('stock').select('*').eq('household_id', hid).eq('id', id).maybeSingle();
        const row = {household_id: hid, id, name, unit: it.unit};
        if (!ex?.cat && it.cat) row.cat = it.cat;
        if (mode === 'bill') {
          row.qty = (+ex?.qty || 0) + q; row.last_bought = new Date().toISOString(); row.last_price = it.price || 0;
          await sb.from('purchases').insert({household_id: hid, name, qty: q, price: it.price || 0, cat: ex?.cat || it.cat || 'other'});
        } else { row.qty = q; snap[name.toLowerCase()] = q; }
        await sb.from('stock').upsert(row, {onConflict:'household_id,id'});
        if (((ex?.min_qty) || 0) > row.qty) {
          const {data:dup} = await sb.from('list_items').select('id').eq('household_id', hid).eq('name', name).eq('done', false);
          if (!dup?.length) await addToList(name);
        }
      }
      if (mode === 'stock') await sb.from('checks').insert({household_id: hid, items: snap});
      dlg.close(); loadAll();
    } catch (e) { alert('Could not save: ' + e.message); $('#save').disabled = false; }
  };
}

// ---------- actions ----------
const wa = t => window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
const where = (q, id) => q.eq('household_id', hid).eq('id', id);
const act = {
  async login() { const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value}); if (error) showLogin(error.message); },
  async signup() {
    const {data:d, error} = await sb.auth.signUp({email: $('#em').value.trim(), password: $('#pw').value});
    if (error) showLogin(error.message); else if (!d.session) showLogin('Check your email to confirm your account, then log in.');
  },
  async reset() { const e = $('#em').value.trim(); if (!e) return showLogin('Type your email first'); await sb.auth.resetPasswordForEmail(e, {redirectTo: location.href}); showLogin('Reset email sent'); },
  logout: () => sb.auth.signOut(),
  async createH() { const {error} = await sb.rpc('create_household', {nm: email}); if (error) return alert(error.message); await loadProfile(); },
  async joinH() { const c = prompt('Enter invite code'); if (c) try { await joinWithCode(c); } catch (e) { alert(e.message); } },
  tab: id => { tab = id; render(); },
  async addItem() { const n = prompt('Add item'); if (n?.trim()) await addToList(n.trim()); },
  favAdd: id => addToList(data.stock.find(s => s.id===id).name),
  async toggle(id, el) { await sb.from('list_items').update({done: el.checked}).eq('id', id); load('list'); },
  async delItem(id) { await sb.from('list_items').delete().eq('id', id); load('list'); },
  share() { wa('Shopping list:\n' + data.list.filter(i => !i.done).map(i => '• ' + i.name).join('\n')); },
  async scan(mode) {
    const f = await pickFile(); if (!f) return;
    showDlg('<p>Reading the photo... this can take up to a minute.</p>');
    try { review(await readPhoto(mode, f), mode); } catch (e) { showDlg(`<p>Could not read the photo: ${esc(e.message)}</p><button onclick="dlg.close()">Close</button>`); }
  },
  async addStock() {
    const n = prompt('Item name'); if (!n?.trim()) return;
    await sb.from('stock').upsert({household_id: hid, id: sid(n), name: n.trim(), qty: 0, unit: 'pcs'}, {onConflict:'household_id,id'}); load('stock');
  },
  item(id) {
    const s = data.stock.find(x => x.id===id), b = (k, t) => `<button data-a="iset" data-id="${esc(id)}" data-k="${k}">${t}</button>`;
    showDlg(`<h3>${esc(s.name)}</h3>${b('fav', s.fav?'Remove from favourites':'Add to favourites')}${b('min','Low-stock minimum')}${b('cat','Category')}${b('packet','Usual packet size')}${b('expiry','Expiry date')}${b('qty','Correct quantity')}${b('del','Delete item')}<button onclick="dlg.close()">Close</button>`);
  },
  async iset(id, el) {
    const k = el.dataset.k, s = data.stock.find(x => x.id===id); dlg.close();
    if (k==='fav') await where(sb.from('stock').update({fav: !s.fav}), id);
    else if (k==='del') await where(sb.from('stock').delete(), id);
    else {
      const v = prompt({min:'Minimum quantity', cat:'Category (dairy, vegetables...)', packet:'Usual packet size, e.g. 5 kg', expiry:'Expiry date as YYYY-MM-DD', qty:'Quantity now'}[k]);
      if (v === null || v === '') return;
      let patch;
      if (k==='min') patch = {min_qty: parseFloat(v) || 0};
      else if (k==='qty') patch = {qty: parseFloat(v) || 0};
      else if (k==='expiry') { if (isNaN(day(v))) return alert('Use YYYY-MM-DD'); patch = {expiry: v}; }
      else patch = {[k]: v};
      await where(sb.from('stock').update(patch), id);
    }
    load('stock');
  },
  menu() {
    showDlg(`<h3>Menu</h3><button data-a="members">Members and roles</button>${isAdmin()?'<button data-a="invite">Invite someone</button><button data-a="ai">Set photo-reading AI (key, URL, model)</button>':''}
    <button data-a="mergeH">Merge into another household</button><button data-a="delAcc">Delete my account</button><button data-a="logout">Log out</button><button onclick="dlg.close()">Close</button>`);
  },
  members() {
    showDlg(`<h3>Members</h3>${members.map(m => `<div class="row"><div>${esc(m.name || m.user_id)}${m.user_id===uid?' (you)':''}<small>${esc(m.role)}</small></div>
      ${isAdmin() && m.user_id!==uid ? `<button data-a="role" data-id="${m.user_id}" style="width:auto">${m.role==='admin'?'Make member':'Make admin'}</button><button data-a="rmMember" data-id="${m.user_id}" style="width:auto">Remove</button>`:''}</div>`).join('')}<button onclick="dlg.close()">Close</button>`);
  },
  async role(u) { const m = members.find(x => x.user_id===u); await sb.from('members').update({role: m.role==='admin'?'member':'admin'}).eq('household_id', hid).eq('user_id', u); dlg.close(); loadMembers(); },
  async rmMember(u) { await sb.from('members').delete().eq('household_id', hid).eq('user_id', u); dlg.close(); loadMembers(); },
  async invite() {
    const {data:code, error} = await sb.rpc('create_invite', {h: hid}); if (error) return alert(error.message);
    showDlg(`<h3>Invite code (valid 24 hours)</h3><p style="font-size:28px;letter-spacing:4px"><b>${esc(code)}</b></p><button id="wab">Share on WhatsApp</button><button onclick="dlg.close()">Close</button>`);
    $('#wab').onclick = () => wa('Join our household in House Groceries with this code: ' + code);
  },
  async mergeH() { dlg.close(); const c = prompt('Invite code of the household to merge into'); if (c) try { await joinWithCode(c); } catch (e) { alert(e.message); } },
  async ai() {
    dlg.close();
    const key = prompt('1/3 Paste your free API key'); if (!key) return;
    const url = prompt('2/3 Provider base URL', 'https://api.groq.com/openai/v1'); if (!url) return;
    const model = prompt('3/3 Vision model name (copy it from the provider model list)'); if (!model) return;
    const {error} = await sb.from('settings').upsert({household_id: hid, ai_key: key, ai_base_url: url, ai_model: model});
    alert(error ? error.message : 'Saved');
  },
  async delAcc() {
    if (!confirm('Delete your account? You leave the household and your login is removed. Shared items stay with the household.')) return;
    const {error} = await sb.rpc('delete_my_account'); if (error) return alert(error.message);
    await sb.auth.signOut({scope:'local'});
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || !act[t.dataset.a]) return;
  Promise.resolve(act[t.dataset.a](t.dataset.id, t)).catch(err => alert(err.message));
});
window.dlg = dlg;

</script>
</body>
</html>
